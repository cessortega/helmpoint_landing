<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelmPoint · La app para tu equipo en campo</title>
<meta name="description" content="HelmPoint: check-in con GPS, formularios, fotos y firma desde el celular, con o sin señal. Panel web, reportes PDF, MFA y conexión con Claude o ChatGPT.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height:100vh;background:var(--bg);color:var(--text);overflow-x:hidden">

  <!-- NAV -->
  <header style="position:fixed;top:14px;left:0;right:0;z-index:40;padding:0 16px">
    <div style="max-width:1180px;margin:0 auto;height:64px;padding:0 10px 0 20px;display:flex;align-items:center;gap:22px;border-radius:999px;background:rgba(18,12,30,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 20px 40px -24px rgba(0,0,0,.6)">
      <a class="sx1" href="#inicio" style="display:flex;align-items:center;gap:9px;color:#FFFFFF" >
        <svg width="28" height="30" viewBox="62 44 230 242" fill="none" style="color:#FFFFFF"><rect x="132" y="50" width="12" height="28" rx="6" fill="#A78BFA"></rect><rect x="132" y="158" width="12" height="28" rx="6" fill="currentColor"></rect><rect x="70" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="178" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 82) rotate(45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 82) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 154) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 154) rotate(45)"></rect><circle cx="138" cy="118" r="27" stroke="currentColor" stroke-width="13"></circle><circle cx="138" cy="118" r="7" fill="currentColor"></circle><g fill="currentColor"><circle cx="138" cy="197" r="7"></circle><circle cx="152" cy="211" r="7"></circle><circle cx="173" cy="211" r="7"></circle><circle cx="195" cy="207" r="7"></circle><circle cx="217" cy="203" r="7"></circle><circle cx="238" cy="202" r="7"></circle></g><circle cx="252" cy="247" r="32" fill="#A78BFA"></circle><circle cx="252" cy="247" r="16" fill="#140C22"></circle><circle cx="252" cy="247" r="8" fill="#A78BFA"></circle></svg>
        <span style="font-size:20px;font-weight:800;letter-spacing:-0.05em">HelmPoint</span>
      </a>
      <nav class="nav-links" style="display:flex;gap:2px">
        <sc-for list="{{ links }}" as="l"><a class="sx2" href="{{ l.href }}" style="height:40px;padding:0 14px;border-radius:999px;display:flex;align-items:center;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.72)" >{{ l.t }}</a></sc-for>
      </nav>
      <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
        <a href="#" class="sx3 nav-links" style="height:44px;padding:0 16px;border-radius:999px;display:flex;align-items:center;font-size:14.5px;font-weight:600;color:#FFFFFF" >Iniciar sesión</a>
        <a class="sx4" href="#demo" style="height:44px;padding:0 20px;border-radius:999px;background:#FFFFFF;color:#140C22;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700" >Pide tu demo {{ I.arrowR }}</a>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section id="inicio" style="position:relative;background:#0C0716;color:#FFFFFF;overflow:hidden;padding:150px 0 90px">
    <div class="blob" style="width:520px;height:520px;background:#7C3AED;top:-160px;left:-120px"></div>
    <div class="blob" style="width:420px;height:420px;background:#4F46E5;top:120px;right:-80px;animation-delay:-5s"></div>
    <div class="blob" style="width:300px;height:300px;background:#C026D3;bottom:-120px;left:40%;opacity:.45;animation-delay:-9s"></div>
    <div class="grid-bg" style="position:absolute;inset:0"></div>
    <svg class="hide-md rv wheel-scene" width="180" height="180" viewBox="0 0 100 100" fill="none" style="position:absolute;right:20px;bottom:10px;color:rgba(255,255,255,.28)"><g class="wheel" stroke="currentColor" stroke-linecap="round" fill="none"><g class="w-sun"><circle cx="28" cy="28" r="13" stroke-width="6"></circle><line x1="9" y1="28" x2="4" y2="28" stroke-width="6"></line><line x1="47" y1="28" x2="52" y2="28" stroke-width="6"></line><line x1="28" y1="47" x2="28" y2="52" stroke-width="6"></line><line x1="28" y1="9" x2="28" y2="4" stroke-width="6"></line><line x1="41.4" y1="14.6" x2="43" y2="13" stroke-width="3.5"></line><line x1="14.6" y1="14.6" x2="13" y2="13" stroke-width="3.5"></line><line x1="14.6" y1="41.4" x2="13" y2="43" stroke-width="3.5"></line><line x1="41.4" y1="41.4" x2="43" y2="43" stroke-width="3.5"></line><circle cx="28" cy="28" r="3.5" fill="currentColor" stroke="none"></circle></g><g class="w-arc"><circle class="w-dot" cx="30" cy="64" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="38" cy="66" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="46" cy="65" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="56" cy="63" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="65" cy="62" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="72" cy="63" r="2" fill="currentColor" stroke="none"></circle></g><g class="w-target"><circle cx="74" cy="80" r="10" stroke-width="6"></circle><circle cx="74" cy="80" r="4" fill="currentColor" stroke="none"></circle></g></g></svg>

    <div class="wrap hero-g" style="position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center">
      <div>
        <span class="up" style="display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 6px 0 6px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:13.5px;font-weight:500;color:rgba(255,255,255,.85)">
          <span style="height:24px;padding:0 10px;border-radius:999px;background:#C8F25C;color:#1C2405;font-size:12px;font-weight:700;display:flex;align-items:center">Nuevo</span>
          Claude y ChatGPT, MFA y formularios anidados
          <span style="display:flex;padding-right:8px;opacity:.7">{{ I.arrowRs }}</span>
        </span>
        <h1 class="up" style="margin:26px 0 0;font-size:clamp(46px,6.6vw,86px);line-height:.95;font-weight:900;letter-spacing:-0.06em;animation-delay:.08s">
          <span style="display:block">Tus <span class="slot"><span style="transform:translateY({{ wordY }})"><sc-for list="{{ words }}" as="w"><span class="shine" style="height:1.1em;display:block">{{ w.t }}</span></sc-for></span></span></span><span style="display:block">en orden, en tiempo real.</span>
        </h1>
        <p class="up" style="margin:26px 0 0;font-size:19px;line-height:1.55;color:rgba(255,255,255,.7);max-width:540px;animation-delay:.16s">Tu equipo en campo hace check-in, llena formularios, sube fotos y firma desde el celular — con o sin señal. Tú lo ves todo en el panel y tu cliente recibe su reporte solo.</p>
        <div class="up" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;animation-delay:.24s">
          <a href="#demo" class="btn" style="background:#7C3AED;color:#FFFFFF;box-shadow:0 18px 40px -14px #7C3AED">Pide tu demo {{ I.arrowR }}</a>
          <a href="#nuevo" class="btn" style="background:rgba(255,255,255,.08);color:#FFFFFF;border:1px solid rgba(255,255,255,.16)"><span style="width:28px;height:28px;border-radius:50%;background:#FFFFFF;color:#140C22;display:grid;place-items:center">{{ I.play }}</span>Ver lo nuevo</a>
        </div>
        <div class="up" style="display:flex;flex-wrap:wrap;gap:22px;margin-top:38px;animation-delay:.32s">
          <sc-for list="{{ heroProof }}" as="p"><span style="display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(255,255,255,.66)"><span style="color:#C8F25C;display:flex">{{ p.ic }}</span>{{ p.t }}</span></sc-for>
        </div>
      </div>

      <!-- Escenario animado: app + panel -->
      <div class="hero-stage" style="position:relative;height:640px">
        <!-- Teléfono -->
        <div class="phone" style="position:absolute;left:50%;top:0;margin-left:-250px;width:300px;height:620px;border-radius:46px;background:#1B1428;padding:10px;box-shadow:0 50px 100px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.12) inset">
          <div style="height:100%;border-radius:37px;background:#F7F6FB;color:#111118;overflow:hidden;display:flex;flex-direction:column;position:relative">
            <div style="height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:600"><span>9:41</span><span style="width:84px;height:22px;border-radius:999px;background:#1B1428"></span><span class="mono" style="font-size:11px;font-weight:600;color:{{ netC }}">{{ net }}</span></div>
            <div style="padding:8px 18px 14px;display:flex;flex-direction:column;gap:3px">
              <span style="font-size:11.5px;font-weight:600;color:#7C3AED" class="mono">ACT-2051</span>
              <span style="font-size:18px;font-weight:800;letter-spacing:-0.03em">Mantenimiento preventivo</span>
              <span style="font-size:12.5px;color:#7E7F8C">Hospital San José · Hoy 09:00</span>
            </div>
            <div style="display:flex;gap:6px;padding:0 18px 14px">
              <sc-for list="{{ pSteps }}" as="ps"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:5px;border-radius:5px;background:{{ ps.bg }};transition:background .4s"></div><span style="font-size:10.5px;font-weight:600;color:{{ ps.fg }}">{{ ps.t }}</span></div></sc-for>
            </div>
            <div style="flex:1;margin:0 12px;border-radius:24px;background:#FFFFFF;border:1px solid #ECEBF2;padding:16px;position:relative;overflow:hidden">

              <sc-if value="{{ st0 }}">
                <div class="drop" style="border-radius:18px;background:#111118;color:#FFFFFF;padding:14px;display:flex;gap:12px;align-items:flex-start">
                  <span style="width:34px;height:34px;border-radius:10px;background:#7C3AED;display:grid;place-items:center;flex:none">{{ I.bell }}</span>
                  <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:13px;font-weight:700">Nueva actividad asignada</span><span style="font-size:12px;opacity:.7">Hospital San José · 09:00</span></div>
                </div>
                <div class="up" style="margin-top:18px;display:flex;flex-direction:column;gap:10px;animation-delay:.3s">
                  <sc-for list="{{ phoneInfo }}" as="r"><div style="display:flex;align-items:center;gap:10px;font-size:13px;color:#4B4C58"><span style="color:#7C3AED;display:flex">{{ r.ic }}</span>{{ r.t }}</div></sc-for>
                </div>
                <div class="up" style="position:absolute;left:16px;right:16px;bottom:16px;height:48px;border-radius:999px;background:#7C3AED;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;animation-delay:.5s">Iniciar actividad</div>
              </sc-if>

              <sc-if value="{{ st1 }}">
                <div style="height:230px;border-radius:18px;background:linear-gradient(135deg,#EFEAFE,#E5F3FF);position:relative;overflow:hidden">
                  <svg width="100%" height="100%" viewBox="0 0 250 230" preserveAspectRatio="none" style="position:absolute;inset:0"><path d="M0 160 C60 140 90 190 150 150 S230 90 250 110" stroke="#FFFFFF" stroke-width="14" fill="none"></path><path d="M70 0 L110 230" stroke="#FFFFFF" stroke-width="10"></path></svg>
                  <div style="position:absolute;left:50%;top:50%;width:0;height:0">
                    <span class="ping" style="width:120px;height:120px;left:-60px;top:-60px"></span>
                    <span class="ping" style="width:120px;height:120px;left:-60px;top:-60px;animation-delay:1s"></span>
                    <span class="pop" style="position:absolute;left:-18px;top:-40px;width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#7C3AED;box-shadow:0 10px 20px -6px #7C3AED"></span>
                  </div>
                </div>
                <div class="up" style="margin-top:16px;padding:12px 14px;border-radius:14px;background:#E4F5E9;color:#11753A;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;animation-delay:.4s">{{ I.checkSm }}Check-in a 24 m del sitio</div>
                <div class="up" style="margin-top:8px;font-size:12px;color:#7E7F8C;animation-delay:.55s">Dentro de la geocerca · 09:01 a.m.</div>
              </sc-if>

              <sc-if value="{{ st2 }}">
                <span style="font-size:12px;font-weight:600;color:#7E7F8C">Checklist · 3 de 4</span>
                <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
                  <sc-for list="{{ formQs }}" as="q">
                    <div class="up" style="padding:11px 12px;border-radius:14px;border:1px solid #ECEBF2;animation-delay:{{ q.dl }};margin-left:{{ q.ml }}">
                      <div style="font-size:12.5px;font-weight:600">{{ q.t }}</div>
                      <div style="display:flex;gap:6px;margin-top:8px"><span style="height:24px;padding:0 12px;border-radius:999px;font-size:11.5px;font-weight:700;display:flex;align-items:center;background:{{ q.yBg }};color:{{ q.yFg }}">Sí</span><span style="height:24px;padding:0 12px;border-radius:999px;font-size:11.5px;font-weight:700;display:flex;align-items:center;background:#F2F3F6;color:#7E7F8C">No</span></div>
                    </div>
                  </sc-for>
                </div>
              </sc-if>

              <sc-if value="{{ st3 }}">
                <span style="font-size:12px;font-weight:600;color:#7E7F8C">Fotos de evidencia</span>
                <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px">
                  <sc-for list="{{ photos }}" as="ph"><div class="pop" style="aspect-ratio:1;border-radius:14px;background:{{ ph.bg }};display:flex;align-items:flex-end;padding:8px;animation-delay:{{ ph.dl }}"><span style="height:20px;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.88);font-size:10px;font-weight:700;display:flex;align-items:center;gap:4px;color:#111118">{{ ph.t }}</span></div></sc-for>
                </div>
              </sc-if>

              <sc-if value="{{ st4 }}">
                <span style="font-size:12px;font-weight:600;color:#7E7F8C">Firma de quien recibe</span>
                <div style="margin-top:12px;height:170px;border-radius:16px;border:1.5px dashed #D6D8DF;background:#FBFBFD;position:relative">
                  <svg width="100%" height="100%" viewBox="0 0 240 170"><path class="sig" d="M20 110 C40 60 60 60 62 100 S80 140 96 96 S120 50 128 92 S150 130 168 88 S200 70 222 96" stroke="#111118" stroke-width="3.5" fill="none" stroke-linecap="round"></path></svg>
                  <span style="position:absolute;left:16px;right:16px;bottom:14px;border-top:1px solid #D6D8DF"></span>
                </div>
                <div class="up" style="margin-top:12px;font-size:13px;font-weight:600;animation-delay:1s">Roberto Salinas · Jefe de mantenimiento</div>
              </sc-if>

              <sc-if value="{{ st5 }}">
                <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px">
                  <div class="pop" style="width:86px;height:86px;border-radius:50%;background:#15A34A;color:#FFFFFF;display:grid;place-items:center;box-shadow:0 0 0 14px #E4F5E9">{{ I.checkLg }}</div>
                  <span class="up" style="margin-top:14px;font-size:20px;font-weight:800;letter-spacing:-0.03em;animation-delay:.2s">Actividad cerrada</span>
                  <span class="up" style="font-size:13px;color:#7E7F8C;animation-delay:.3s">42 min · 4 de 4 pasos</span>
                  <span class="up" style="margin-top:6px;height:30px;padding:0 12px;border-radius:999px;background:#F3EEFF;color:#5B21B6;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;animation-delay:.5s">{{ I.mailSm }}Correo enviado al cliente</span>
                </div>
              </sc-if>
            </div>
            <div style="height:20px"></div>
          </div>
        </div>

        <!-- Panel web flotante -->
        <div class="panel-float float" style="position:absolute;right:-6px;top:70px;width:300px;border-radius:22px;background:rgba(255,255,255,.96);color:#111118;padding:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);animation-delay:-2s">
          <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:12px;font-weight:700;color:#7E7F8C;letter-spacing:.06em;text-transform:uppercase">Panel · Hoy</span><span style="display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#15A34A"><span style="width:7px;height:7px;border-radius:50%;background:#15A34A;animation:hp-pulse 1.4s infinite"></span>En vivo</span></div>
          <div style="margin-top:12px;padding:12px;border-radius:14px;background:#F7F6FB;border:1px solid {{ pnl.bd }};transition:border-color .4s">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span style="font-size:13.5px;font-weight:700">Mant. preventivo</span><span style="height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;display:flex;align-items:center;background:{{ pnl.bg }};color:{{ pnl.fg }};transition:all .4s">{{ pnl.st }}</span></div>
            <div style="font-size:12px;color:#7E7F8C;margin-top:3px">Hospital San José · Jorge T.</div>
            <div style="height:6px;border-radius:6px;background:#E8E9EE;margin-top:10px;overflow:hidden"><div style="height:100%;width:{{ pnl.w }};background:{{ pnl.c }};border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1),background .4s"></div></div>
          </div>
          <sc-for list="{{ panelRows }}" as="r"><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 4px 0;font-size:12.5px"><span style="font-weight:600">{{ r.t }}</span><span style="height:20px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:700;display:flex;align-items:center;background:{{ r.bg }};color:{{ r.fg }}">{{ r.st }}</span></div></sc-for>
        </div>

        <!-- Chips flotantes -->
        <div class="float panel-float" style="position:absolute;right:28px;bottom:170px;animation-delay:-1s"><span style="display:flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 8px;border-radius:999px;background:#1B1428;border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 40px -18px rgba(0,0,0,.8);font-size:13px;font-weight:600;color:#FFFFFF;white-space:nowrap"><span style="width:28px;height:28px;border-radius:50%;background:#C8F25C;color:#1C2405;display:grid;place-items:center">{{ I.shieldSm }}</span>MFA activo</span></div>
        <div class="float panel-float" style="position:absolute;right:0;bottom:104px;animation-delay:-3.5s"><span style="display:flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 8px;border-radius:999px;background:#1B1428;border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 40px -18px rgba(0,0,0,.8);font-size:13px;font-weight:600;color:#FFFFFF;white-space:nowrap"><span style="width:28px;height:28px;border-radius:50%;background:#A78BFA;color:#140C22;display:grid;place-items:center">{{ I.sparkleSm }}</span>IA conectada</span></div>
        <sc-if value="{{ st5 }}">
          <div class="panel-float drop" style="position:absolute;right:20px;top:330px;width:260px;border-radius:18px;background:#111118;color:#FFFFFF;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.1)"><span style="height:28px;padding:0 7px;border-radius:7px;background:#FDECEC;color:#B01C1C;font-size:11px;font-weight:800;display:grid;place-items:center">PDF</span><div style="display:flex;flex-direction:column"><span style="font-size:13px;font-weight:700">Reporte listo</span><span style="font-size:11.5px;opacity:.65">Con fotos, respuestas y firma</span></div></div>
        </sc-if>
      </div>
    </div>
  </section>

  <!-- MARQUEE industrias -->
  <div style="background:#0C0716;border-top:1px solid rgba(255,255,255,.08);padding:22px 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)">
    <div class="mq">
      <sc-for list="{{ industries }}" as="i"><span style="flex:none;height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75);display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500"><span style="color:#A78BFA;display:flex">{{ i.ic }}</span>{{ i.t }}</span></sc-for>
    </div>
  </div>

  <!-- ANTES / DESPUÉS -->
  <section id="producto" style="padding:120px 0 40px">
    <div class="wrap">
      <div class="rv" style="text-align:center;display:flex;flex-direction:column;align-items:center">
        <span class="kick">Sin cambiar cómo trabajas</span>
        <h2 class="h2" style="max-width:860px">Sigue usando WhatsApp y Excel. Ahora se llenan solos.</h2>
      </div>
      <div class="two" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:56px">
        <div class="card rv" style="padding:32px;background:var(--surface-2);border-color:transparent">
          <span style="font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)">Hoy, a mano</span>
          <div style="display:flex;flex-direction:column;gap:14px;margin-top:20px">

      <div class="plans" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:44px;align-items:stretch">
        <sc-for list="{{ plans }}" as="p">
          <div class="tilt rv" style="border-radius:28px;padding:30px;background:{{ p.bg }};color:{{ p.fg }};border:{{ p.border }};box-shadow:{{ p.sh }};display:flex;flex-direction:column;position:relative;overflow:hidden">
            <sc-if value="{{ p.pop }}"><span style="position:absolute;top:22px;right:22px;height:26px;padding:0 10px;border-radius:999px;background:#C8F25C;color:#1C2405;font-size:12px;font-weight:700;display:flex;align-items:center">Más elegido</span></sc-if>
            <span style="font-size:20px;font-weight:800;letter-spacing:-0.03em">{{ p.name }}</span>
            <span style="font-size:14.5px;opacity:.75;margin-top:6px;min-height:42px">{{ p.desc }}</span>
            <div style="display:flex;align-items:flex-end;gap:8px;margin-top:18px"><span style="font-size:48px;font-weight:900;letter-spacing:-0.05em;line-height:1">{{ p.price }}</span><sc-if value="{{ p.unit }}"><span style="display:flex;flex-direction:column;line-height:1.25;padding-bottom:6px"><span style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75">+ IVA</span><span style="font-size:13px;opacity:.7">{{ p.unit }}</span></span></sc-if></div>
            <sc-if value="{{ p.yearly }}"><span style="margin-top:6px;font-size:12.5px;font-weight:600;opacity:.65">{{ p.yearly }}</span></sc-if>
            <div style="display:flex;flex-direction:column;gap:11px;margin:24px 0 28px">
              <sc-for list="{{ p.items }}" as="it"><span style="display:flex;gap:10px;align-items:center;font-size:14.5px"><span style="width:22px;height:22px;border-radius:50%;background:{{ p.chkBg }};color:{{ p.chkFg }};display:grid;place-items:center;flex:none">{{ I.checkXs }}</span>{{ it.t }}</span></sc-for>
            </div>
            <a class="sx5" href="#demo" style="margin-top:auto;height:50px;border-radius:999px;background:{{ p.btnBg }};color:{{ p.btnFg }};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700" >{{ p.cta }}</a>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <!-- FAQ -->
  <section id="faq" style="padding:20px 0 100px">
    <div class="wrap two" style="display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:start">
      <div class="rv"><span class="kick">Preguntas</span><h2 class="h2">Lo que siempre nos preguntan.</h2></div>
      <div class="card rv d1" style="border-radius:24px">
        <sc-for list="{{ faqs }}" as="f">
          <div style="border-top:{{ f.div }}">
            <button type="button" aria-expanded="{{ f.aria }}" onClick="{{ f.on }}" style="width:100%;border:0;background:none;cursor:pointer;padding:20px 22px;display:flex;align-items:center;gap:14px;text-align:left;font-size:16.5px;font-weight:700;color:var(--text)">{{ f.q }}<span style="margin-left:auto;width:30px;height:30px;border-radius:50%;background:{{ f.nBg }};color:{{ f.nFg }};display:grid;place-items:center;flex:none;transform:{{ f.rot }};transition:all .3s">{{ I.plusSm }}</span></button>
            <sc-if value="{{ f.open }}"><p class="up" style="margin:0;padding:0 66px 22px 22px;font-size:15px;line-height:1.6;color:var(--text-2)">{{ f.a }}</p></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <!-- DEMO -->
  <section id="demo" style="padding:0 0 100px">
    <div class="wrap">
      <div class="rv two" style="border-radius:36px;background:linear-gradient(140deg,#8B5CF6,#5B21B6 60%,#3B0F8C);color:#FFFFFF;padding:56px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;position:relative;overflow:hidden">
        <svg class="rv wheel-scene" width="220" height="232" viewBox="-15 -15 130 130" fill="none" overflow="visible" style="position:absolute;left:0;bottom:0;color:rgba(255,255,255,.13)"><g class="wheel" stroke="currentColor" stroke-linecap="round" fill="none"><g class="w-sun"><circle cx="28" cy="28" r="13" stroke-width="6"></circle><line x1="9" y1="28" x2="4" y2="28" stroke-width="6"></line><line x1="47" y1="28" x2="52" y2="28" stroke-width="6"></line><line x1="28" y1="47" x2="28" y2="52" stroke-width="6"></line><line x1="28" y1="9" x2="28" y2="4" stroke-width="6"></line><line x1="41.4" y1="14.6" x2="43" y2="13" stroke-width="3.5"></line><line x1="14.6" y1="14.6" x2="13" y2="13" stroke-width="3.5"></line><line x1="14.6" y1="41.4" x2="13" y2="43" stroke-width="3.5"></line><line x1="41.4" y1="41.4" x2="43" y2="43" stroke-width="3.5"></line><circle cx="28" cy="28" r="3.5" fill="currentColor" stroke="none"></circle></g><g class="w-arc"><circle class="w-dot" cx="30" cy="64" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="38" cy="66" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="46" cy="65" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="56" cy="63" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="65" cy="62" r="2" fill="currentColor" stroke="none"></circle><circle class="w-dot" cx="72" cy="63" r="2" fill="currentColor" stroke="none"></circle></g><g class="w-target"><circle cx="74" cy="80" r="10" stroke-width="6"></circle><circle cx="74" cy="80" r="4" fill="currentColor" stroke="none"></circle></g></g></svg>
        <div style="position:relative">
          <h2 class="h2">Pon a tu equipo en orden esta semana.</h2>
          <p style="margin:16px 0 0;font-size:18px;line-height:1.55;color:rgba(255,255,255,.75)">Te mostramos HelmPoint con tu propio flujo en 30 minutos.</p>
          <div style="display:flex;flex-direction:column;gap:12px;margin-top:26px">
            <sc-for list="{{ demoPts }}" as="d"><span style="display:flex;gap:10px;align-items:center;font-size:15.5px;font-weight:500"><span style="width:24px;height:24px;border-radius:50%;background:#C8F25C;color:#1C2405;display:grid;place-items:center">{{ I.checkXs }}</span>{{ d.t }}</span></sc-for>
          </div>
        </div>
        <div style="position:relative;border-radius:26px;background:#FFFFFF;color:#111118;padding:28px">
          <sc-if value="{{ notSent }}">
            <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:14px">
              <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600">Nombre<input value="{{ name }}" onChange="{{ onName }}" placeholder="Tu nombre" style="height:50px;padding:0 16px;border-radius:14px;border:1px solid #D6D8DF;font-size:15px;outline:none;color:#111118;background:#FFFFFF"></input></label>
              <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600">Correo electrónico<input type="email" value="{{ mail }}" onChange="{{ onMail }}" placeholder="nombre@empresa.com" style="height:50px;padding:0 16px;border-radius:14px;border:1px solid #D6D8DF;font-size:15px;outline:none;color:#111118;background:#FFFFFF"></input></label>
              <span style="font-size:14px;font-weight:600">¿Cuántas personas tienes en campo?</span>
              <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
                <sc-for list="{{ sizes }}" as="z"><button type="button" aria-pressed="{{ z.aria }}" onClick="{{ z.on }}" style="height:44px;border-radius:12px;border:{{ z.border }};background:{{ z.bg }};color:{{ z.fg }};font-size:14px;font-weight:700;cursor:pointer">{{ z.t }}</button></sc-for>
              </div>
              <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600">Caso de uso o flujo que te gustaría probar <span style="font-weight:500;color:#7E7F8C">(opcional)</span><textarea value="{{ useCase }}" onInput="{{ onUseCase }}" placeholder="Ej. Inspecciones de obra, mantenimiento de clima, entregas de última milla, rondines de seguridad…" rows="3" style="padding:12px 16px;border-radius:14px;border:1px solid #D6D8DF;font-size:15px;outline:none;color:#111118;background:#FFFFFF;resize:vertical;font-family:inherit;line-height:1.45"></textarea></label>
              <sc-if value="{{ hasError }}"><span style="font-size:13.5px;color:#B01C1C;background:#FDECEC;border:1px solid #F5C7C7;border-radius:12px;padding:10px 14px">{{ error }}</span></sc-if>
              <button class="sx6" type="submit" disabled="{{ blocked }}" style="margin-top:6px;height:52px;border:0;border-radius:999px;background:#7C3AED;color:#FFFFFF;font-size:15.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;opacity:{{ blockedOpacity }}" >{{ submitLabel }} {{ I.arrowR }}</button>
              <span style="font-size:12.5px;line-height:1.5;color:#7E7F8C;text-align:center">Al enviar aceptas nuestro <a href="#" onclick="{{ openPriv }}" style="color:#5B21B6;font-weight:600;text-decoration:underline">Aviso de Privacidad</a>.</span>
            </form>
          </sc-if>
          <sc-if value="{{ sent }}">
            <div style="text-align:center;padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:12px">
              <div class="pop" style="width:80px;height:80px;border-radius:50%;background:#15A34A;color:#FFFFFF;display:grid;place-items:center;box-shadow:0 0 0 12px #E4F5E9">{{ I.checkLg }}</div>
              <span class="up" style="margin-top:12px;font-size:24px;font-weight:800;letter-spacing:-0.03em">¡Listo, {{ firstName }}!</span>
              <span class="up" style="font-size:15px;color:#4B4C58;animation-delay:.1s">Te escribimos hoy mismo para agendar tu demo.</span>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer style="border-top:1px solid var(--line);padding:56px 0 40px">
    <div class="wrap foot-g" style="display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:32px">
      <div style="display:flex;flex-direction:column;gap:14px">
        <span style="display:flex;align-items:center;gap:9px"><svg width="28" height="30" viewBox="62 44 230 242" fill="none" style="color:var(--text)"><rect x="132" y="50" width="12" height="28" rx="6" fill="#7C3AED"></rect><rect x="132" y="158" width="12" height="28" rx="6" fill="currentColor"></rect><rect x="70" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="178" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 82) rotate(45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 82) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 154) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 154) rotate(45)"></rect><circle cx="138" cy="118" r="27" stroke="currentColor" stroke-width="13"></circle><circle cx="138" cy="118" r="7" fill="currentColor"></circle><g fill="currentColor"><circle class="trail" cx="138" cy="197" r="7"></circle><circle class="trail" cx="152" cy="211" r="7" style="animation-delay:.15s"></circle><circle class="trail" cx="173" cy="211" r="7" style="animation-delay:.3s"></circle><circle class="trail" cx="195" cy="207" r="7" style="animation-delay:.45s"></circle><circle class="trail" cx="217" cy="203" r="7" style="animation-delay:.6s"></circle><circle class="trail" cx="238" cy="202" r="7" style="animation-delay:.75s"></circle></g><circle cx="252" cy="247" r="32" fill="#7C3AED"></circle><circle cx="252" cy="247" r="16" fill="var(--bg)"></circle><circle cx="252" cy="247" r="8" fill="#7C3AED"></circle></svg><span style="font-size:20px;font-weight:800;letter-spacing:-0.05em">HelmPoint</span></span>
        <span style="font-size:14px;color:var(--text-3);max-width:280px;line-height:1.5">La app para tu equipo en campo y el panel para quien lo dirige.</span>
      </div>
      <sc-for list="{{ footCols }}" as="c">
        <div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:13px;font-weight:700;color:var(--text)">{{ c.t }}</span><sc-for list="{{ c.items }}" as="i"><a href="{{ i.h }}" onclick="{{ i.on }}" style="font-size:14px;color:var(--text-3)">{{ i.t }}</a></sc-for></div>
      </sc-for>
    </div>
    <div class="wrap" style="margin-top:40px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:13px;color:var(--text-3)"><span>© 2026 HelmPoint · Helmdeck S.A.S.</span><a href="#" onclick="{{ openPriv }}" style="color:var(--text-3)">Aviso de Privacidad</a><a href="#" onclick="{{ openTerms }}" style="color:var(--text-3)">Términos de uso</a></div>
  </footer>
  <!-- LEGAL (modal) -->
  <sc-if value="{{ lg.open }}">
    <div role="dialog" aria-modal="true" aria-label="Legal" style="position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px">
      <div onClick="{{ lg.close }}" style="position:absolute;inset:0;background:rgba(17,17,24,.48);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:hpFade .25s ease both"></div>
      <div style="position:relative;width:100%;max-width:640px;max-height:calc(100vh - 32px);background:var(--surface);color:var(--text);border-radius:30px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 90px -30px rgba(17,17,30,.5);animation:hpModal .35s cubic-bezier(.2,.8,.2,1) both">
        <div style="padding:26px 28px 0;display:flex;align-items:center;gap:12px">
          <svg width="26" height="28" viewBox="62 44 230 242" fill="none" style="color:var(--text)"><rect x="132" y="50" width="12" height="28" rx="6" fill="#7C3AED"></rect><rect x="132" y="158" width="12" height="28" rx="6" fill="currentColor"></rect><rect x="70" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="178" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 82) rotate(45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 82) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 154) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 154) rotate(45)"></rect><circle cx="138" cy="118" r="27" stroke="currentColor" stroke-width="13"></circle><circle cx="138" cy="118" r="7" fill="currentColor"></circle><g fill="currentColor"><circle cx="138" cy="197" r="7"></circle><circle cx="152" cy="211" r="7"></circle><circle cx="173" cy="211" r="7"></circle><circle cx="195" cy="207" r="7"></circle><circle cx="217" cy="203" r="7"></circle><circle cx="238" cy="202" r="7"></circle></g><circle cx="252" cy="247" r="32" fill="#7C3AED"></circle><circle cx="252" cy="247" r="16" fill="var(--surface)"></circle><circle cx="252" cy="247" r="8" fill="#7C3AED"></circle></svg>
          <span style="font-size:22px;font-weight:800;letter-spacing:-0.03em">Legal</span>
          <button class="sx101" type="button" onClick="{{ lg.close }}" aria-label="Cerrar" style="margin-left:auto;width:40px;height:40px;border:0;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;cursor:pointer" >{{ I.x }}</button>
        </div>
        <div style="padding:18px 28px 0">
          <div role="tablist" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--surface-2)">
            <sc-for list="{{ lg.tabs }}" as="tb"><button type="button" role="tab" aria-selected="{{ tb.aria }}" onClick="{{ tb.on }}" style="height:42px;border:0;border-radius:12px;background:{{ tb.bg }};color:{{ tb.fg }};box-shadow:{{ tb.sh }};font-size:14.5px;font-weight:600;cursor:pointer;transition:all .2s">{{ tb.t }}</button></sc-for>
          </div>
        </div>
        <div class="lg-body" style="flex:1;min-height:0;overflow-y:auto;padding:24px 28px 8px">
          <h2 style="margin:0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-0.035em">{{ lg.d.title }}</h2>
          <div style="display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;color:var(--text-3)"><span style="height:24px;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-weight:600;display:flex;align-items:center">{{ lg.d.ver }}</span>{{ lg.d.date }}</div>
          <div style="margin-top:20px;padding:20px;border-radius:22px;background:var(--accent-soft)">
            <span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)">En resumen</span>
            <div style="display:flex;flex-direction:column;gap:16px;margin-top:14px">
              <sc-for list="{{ lg.d.sum }}" as="m"><div style="display:flex;gap:14px;align-items:flex-start"><span style="width:36px;height:36px;border-radius:50%;background:var(--accent);color:#FFFFFF;display:grid;place-items:center;flex:none">{{ m.ic }}</span><div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:700">{{ m.t }}</span><span style="font-size:14px;line-height:1.5;color:var(--text-2)">{{ m.d }}</span></div></div></sc-for>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
            <sc-for list="{{ lg.d.secs }}" as="x">
              <div style="border:1px solid {{ x.bd }};border-radius:20px;overflow:hidden;transition:border-color .2s">
                <button type="button" aria-expanded="{{ x.aria }}" onClick="{{ x.on }}" style="width:100%;border:0;background:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--text)">
                  <span style="width:32px;height:32px;border-radius:50%;background:var(--accent);color:#FFFFFF;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none">{{ x.n }}</span>
                  <span style="flex:1;font-size:15.5px;font-weight:700">{{ x.t }}</span>
                  <span style="display:flex;color:var(--text-3);transform:{{ x.rot }};transition:transform .25s">{{ I.chevD }}</span>
                </button>
                <sc-if value="{{ x.open }}">
                  <div class="up" style="padding:0 18px 18px 62px;display:flex;flex-direction:column;gap:10px">
                    <sc-for list="{{ x.ps }}" as="p"><p style="margin:0;font-size:14.5px;line-height:1.6;color:var(--text-2)">{{ p.t }}</p></sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
          <p style="margin:18px 0 10px;font-size:13px;line-height:1.55;color:var(--text-3)">{{ lg.d.foot }}</p>
        </div>
        <div style="padding:16px 28px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:13px;color:var(--text-3)">¿Dudas? <b style="color:var(--text-2);font-weight:600">{{ lg.mail }}</b></span>
          <button class="sx102" type="button" onClick="{{ lg.close }}" style="margin-left:auto;height:48px;padding:0 28px;border:0;border-radius:999px;background:var(--accent);color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer" >Entendido</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</template>
<script src="assets/icons.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
