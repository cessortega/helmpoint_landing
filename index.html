<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelmPoint · La app para tu equipo en campo</title>
<meta name="description" content="HelmPoint: ubicación, formularios, fotos y firma desde el celular, con o sin señal. Panel web en tiempo real, autorización de cierres, MFA y conexión con Claude o ChatGPT.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height:100vh;background:#FFFFFF;color:#111118;overflow-x:clip">

  <!-- NAV -->
  <header style="position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #F0F0F4">
    <div class="wrap" style="height:72px;display:flex;align-items:center;gap:28px">
      <a class="sx1" href="#inicio" style="display:flex;align-items:center;gap:9px;color:#111118" >
        <svg width="28" height="30" viewBox="62 44 230 242" fill="none" style="color:#111118"><rect x="132" y="50" width="12" height="28" rx="6" fill="#7C3AED"></rect><rect x="132" y="158" width="12" height="28" rx="6" fill="currentColor"></rect><rect x="70" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="178" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 82) rotate(45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 82) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 154) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 154) rotate(45)"></rect><circle cx="138" cy="118" r="27" stroke="currentColor" stroke-width="13"></circle><circle cx="138" cy="118" r="7" fill="currentColor"></circle><g fill="currentColor"><circle cx="138" cy="197" r="7"></circle><circle cx="152" cy="211" r="7"></circle><circle cx="173" cy="211" r="7"></circle><circle cx="195" cy="207" r="7"></circle><circle cx="217" cy="203" r="7"></circle><circle cx="238" cy="202" r="7"></circle></g><circle cx="252" cy="247" r="32" fill="#7C3AED"></circle><circle cx="252" cy="247" r="16" fill="#FFFFFF"></circle><circle cx="252" cy="247" r="8" fill="#7C3AED"></circle></svg>
        <span style="font-size:20px;font-weight:800;letter-spacing:-0.04em">HelmPoint</span>
      </a>
      <nav class="nav-links" style="display:flex;gap:4px">
        <sc-for list="{{ links }}" as="l"><a class="sx2" href="{{ l.href }}" style="height:40px;padding:0 12px;border-radius:999px;display:flex;align-items:center;font-size:14.5px;font-weight:500;color:#4B4C58" >{{ l.t }}</a></sc-for>
      </nav>
      <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
        <a href="#" class="sx3 nav-links" style="height:44px;padding:0 14px;display:flex;align-items:center;font-size:14.5px;font-weight:600;color:#111118" >Iniciar sesión</a>
        <a href="#demo" class="btn p" style="height:44px;padding:0 20px;font-size:14.5px">Pide tu demo</a>
      </div>
    </div>
  </header>

  <!-- HERO: la misma actividad en la app y en el panel -->
  <section id="inicio" style="padding:8px 0 0">
    <div class="wrap">
      <div class="hero-g">
        <div class="hero-t">
          <span class="kick">App para equipos en campo</span>
          <h1>Tus visitas en orden, <em>en tiempo real.</em></h1>
          <p class="lead" style="font-size:18px">Tu equipo registra desde el celular lo que cada actividad pida: ubicación, formulario, fotos o firma, con o sin señal. Tú la ves avanzar en el panel, paso por paso.</p>
          <div style="display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:30px;align-items:center">
            <a href="#demo" class="btn p">Pide tu demo {{ I.arrowR }}</a>
            <a href="#como" class="lnk">Ver cómo funciona {{ I.chevR }}</a>
          </div>
          <div class="route"><span><i></i>Asignas</span><b></b><span><i></i>Se registra en sitio</span><b></b><span class="end"><i></i>Autorizas el cierre</span></div>
        </div>
        <div class="fit hero-art" data-w="480" data-max="1.125" style="--w:480;--h:650" aria-hidden="true"><div class="fit-in">
          <svg class="trail" viewBox="0 0 480 610" width="480" height="610" fill="none" style="position:absolute;left:0;top:0">
            <g transform="translate(60 482)"><g class="spin" fill="#111118">
              <rect x="-4.5" y="-46" width="9" height="20" rx="4.5" fill="#7C3AED"></rect><rect x="-4.5" y="26" width="9" height="20" rx="4.5"></rect><rect x="-46" y="-4.5" width="20" height="9" rx="4.5"></rect><rect x="26" y="-4.5" width="20" height="9" rx="4.5"></rect>
              <rect x="-6" y="-4" width="12" height="8" rx="4" transform="rotate(45) translate(34 0)"></rect><rect x="-6" y="-4" width="12" height="8" rx="4" transform="rotate(135) translate(34 0)"></rect><rect x="-6" y="-4" width="12" height="8" rx="4" transform="rotate(225) translate(34 0)"></rect><rect x="-6" y="-4" width="12" height="8" rx="4" transform="rotate(315) translate(34 0)"></rect>
              <circle r="19" fill="none" stroke="#111118" stroke-width="9"></circle><circle r="5"></circle>
            </g></g>
            <g fill="#111118"><circle class="d" cx="56" cy="402" r="5.5" style="animation-delay:0s"></circle><circle class="d" cx="56" cy="364" r="5.5" style="animation-delay:.18s"></circle><circle class="d" cx="61" cy="296" r="5.5" style="animation-delay:.36s"></circle><circle class="d" cx="74" cy="237" r="5.5" style="animation-delay:.54s"></circle><circle class="d" cx="95" cy="186" r="5.5" style="animation-delay:.72s"></circle><circle class="d" cx="125" cy="142" r="5.5" style="animation-delay:.9s"></circle><circle class="d" cx="163" cy="108" r="5.5" style="animation-delay:1.08s"></circle><circle class="d" cx="210" cy="81" r="5.5" style="animation-delay:1.26s"></circle><circle class="d" cx="265" cy="62" r="5.5" style="animation-delay:1.44s"></circle><circle class="d" cx="328" cy="52" r="5.5" style="animation-delay:1.62s"></circle><circle class="d" cx="384" cy="48" r="5.5" style="animation-delay:1.8s"></circle></g>
            <g class="tgt"><circle cx="434" cy="46" r="26" fill="#7C3AED"></circle><circle cx="434" cy="46" r="13" fill="#FFFFFF"></circle><circle cx="434" cy="46" r="6.5" fill="#7C3AED"></circle></g>
          </svg>
          <div class="ph" style="--s:.68;left:150px;top:78px"><div class="ph-b"><div class="ph-s">
            <sc-if value="{{ hero.list }}"><div class="fade a-col"><sc-use tpl="p-sb" with="{{ sbD }}"></sc-use><sc-use tpl="p-list" with="{{ hero.l }}"></sc-use></div></sc-if>
            <sc-if value="{{ hero.det }}"><div class="fade a-col"><sc-use tpl="p-detail" with="{{ hero.d }}"></sc-use></div></sc-if>
            <i class="ph-g"></i>
          </div></div></div>
        </div></div>
      </div>
    </div>
  </section>

  <!-- CÓMO FUNCIONA: textos a la izquierda, escenario fijo a la derecha -->
  <section id="como" style="padding:110px 0 40px">
    <div class="wrap">
      <div class="rv" style="text-align:center;display:flex;flex-direction:column;align-items:center">
        <span class="kick">Cómo funciona</span>
        <h2 class="h2" style="max-width:720px">De la asignación al reporte, sin perseguir a nadie.</h2>
      </div>
      <div class="feat-g">
        <div>
          <sc-for list="{{ steps }}" as="x">
            <div class="{{ x.cls }}" data-feat="{{ x.i }}" onClick="{{ x.on }}"><div>
              <span class="kick" style="color:#7C3AED">{{ x.k }}</span>
              <h3>{{ x.t }}</h3>
              <p class="lead" style="font-size:16px">{{ x.d }}</p>
              <div class="feat-b"><sc-for list="{{ x.b }}" as="b"><div><span class="chk" style="margin-top:2px">{{ I.checkXs }}</span>{{ b.t }}</div></sc-for></div>
              <div class="hl"><span class="hl-i">{{ x.hl.ic }}</span><div><b>{{ x.hl.t }}</b><p>{{ x.hl.d }}</p><sc-if value="{{ x.hl.has }}"><div class="hl-c"><sc-for list="{{ x.hl.chips }}" as="c"><span>{{ c.t }}</span></sc-for></div></sc-if></div></div>
            </div></div>
          </sc-for>
        </div>

        <div class="stage" aria-hidden="true">
          <div class="fit" data-w="650" style="--w:650;--h:640"><div class="fit-in stage-in">
            <span class="where">{{ st.whereIc }}{{ st.where }}</span>

            <!-- 01 Diseña: constructor del tipo de actividad -->
            <sc-if value="{{ st.f0 }}"><div class="fade">
              <div class="win" style="left:24px;top:60px;width:602px;height:470px">
                <div class="win-nav"><b>HelmPoint</b><span>Inicio</span><span>Actividades</span><span class="on">Catálogos</span><span>Equipo</span><span>Ajustes</span><u>MR</u></div>
                <div style="padding:14px 18px 0;display:flex;align-items:center;gap:10px"><b style="font-size:16px;font-weight:700;letter-spacing:-0.02em">Mantenimiento preventivo</b><span class="bdg" style="background:#E4F5E9;color:#11753A">Guardado</span></div>
                <div style="display:flex;gap:16px;padding:12px 18px 0;border-bottom:1px solid #F0F0F4;font-size:11.5px;font-weight:500;color:#7E7F8C;white-space:nowrap"><span style="padding-bottom:10px">Generales</span><span style="padding-bottom:10px">Comportamiento</span><span style="padding-bottom:10px;color:#5B21B6;font-weight:700;border-bottom:2px solid #7C3AED">Secuencia de pasos</span><span style="padding-bottom:10px">Notificaciones</span><span style="padding-bottom:10px">Usuarios y autorizadores</span></div>
                <div style="display:grid;grid-template-columns:140px 1fr;gap:16px;padding:16px 18px">
                  <div>
                    <div style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7E7F8C;margin-bottom:8px">Pasos disponibles</div>
                    <div style="display:flex;flex-direction:column;gap:6px"><sc-for list="{{ pal }}" as="p"><div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 9px;border-radius:10px;background:#F7F7F9;font-size:11px;font-weight:600;white-space:nowrap"><span style="color:{{ p.fg }};display:flex">{{ p.ic }}</span>{{ p.t }}</div></sc-for></div>
                  </div>
                  <div style="padding-right:216px">
                    <div style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7E7F8C;margin-bottom:8px">El orden es el flujo en la app</div>
                    <div style="display:flex;flex-direction:column;gap:6px"><sc-for list="{{ seq }}" as="q"><div class="seq" style="margin-left:{{ q.ml }};border-color:{{ q.bd }}"><span style="color:#B9BBC6;display:flex">{{ I.grip }}</span><i style="background:{{ q.bg }};color:{{ q.fg }}">{{ q.ic }}</i><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ q.t }}</span></div></sc-for></div>
                    <div style="margin-top:10px;display:flex;gap:7px;font-size:11px;line-height:1.4;color:#5B21B6"><span style="display:flex;margin-top:1px">{{ I.aLock }}</span>Se desbloquean en la app al completar el paso 2</div>
                  </div>
                </div>
              </div>
              <div class="ph" style="--s:.5;right:14px;bottom:-34px"><div class="ph-b"><div class="ph-s"><sc-use tpl="p-detail" with="{{ st.d0 }}"></sc-use><i class="ph-g"></i></div></div></div>
            </div></sc-if>

            <!-- 02 Asigna: alta en el panel y aviso en la app -->
            <sc-if value="{{ st.f1 }}"><div class="fade">
              <div class="win" style="left:24px;top:60px;width:372px;padding:20px">
                <b style="display:block;font-size:17px;font-weight:700;letter-spacing:-0.02em">Nueva actividad</b>
                <span style="display:block;margin-top:3px;font-size:12px;color:#7E7F8C">Asigna una actividad a tu equipo en campo.</span>
                <div style="display:flex;flex-direction:column;gap:11px;margin-top:16px">
                  <label class="fld">Tipo de actividad *<span>Mantenimiento preventivo · 5 pasos<em style="margin-left:auto;display:flex;color:#7E7F8C">{{ I.chevD14 }}</em></span></label>
                  <label class="fld">Asignado a *<span><i class="av" style="width:20px;height:20px;font-size:8.5px;font-style:normal">JT</i>Jorge Treviño</span></label>
                  <label class="fld">Cliente<span>Hospital San José</span></label>
                  <label class="fld">Dirección<span>Av. Constitución 1450, Centro, Monterrey</span></label>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="fld">Inicio programado<span><em style="display:flex;color:#7E7F8C">{{ I.cal14 }}</em>Hoy · 09:00</span></label><label class="fld">Fin programado<span><em style="display:flex;color:#7E7F8C">{{ I.cal14 }}</em>Hoy · 11:00</span></label></div>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><span class="wbtn o">Cancelar</span><span class="wbtn p">Asignar</span></div>
              </div>
              <div class="ph" style="--s:.6;left:392px;top:112px"><div class="ph-b"><div class="ph-s"><sc-use tpl="p-sb" with="{{ sbD }}"></sc-use><sc-use tpl="p-list" with="{{ st.l }}"></sc-use><i class="ph-g"></i></div></div></div>
            </div></sc-if>

            <!-- 03 Captura: los pasos en la app -->
            <sc-if value="{{ st.f2 }}"><div class="fade">
              <div style="position:absolute;left:28px;top:150px;width:262px;display:flex;flex-direction:column;gap:4px">
                <sc-for list="{{ st.cap.mini }}" as="m"><div class="{{ m.cls }}"><i>{{ m.n }}</i>{{ m.t }}</div></sc-for>
              </div>
              <div class="ph" style="--s:.72;left:326px;top:34px"><div class="ph-b"><div class="ph-s">
                <sc-if value="{{ st.cap.u }}"><div class="fade a-col"><sc-use tpl="p-sb" with="{{ sbD }}"></sc-use>
                  <div class="a-top"><div><span>{{ I.aBack }}</span><b>Ubicación</b><span></span></div></div>
                  <div style="flex:1;min-height:0;position:relative;display:grid;place-items:center"><svg viewBox="0 0 390 560" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%"><rect width="390" height="560" fill="#E9EDF3"></rect><path d="M-20 140 420 60M-20 330 420 260M-20 500 420 470M90 -20 130 600M260 -20 300 600" stroke="#fff" stroke-width="16"></path><path d="M-20 230 420 170M180 -20 200 600" stroke="#fff" stroke-width="7"></path><rect x="150" y="290" width="90" height="140" rx="10" fill="#DDEBD3" transform="rotate(-8 195 360)"></rect><path d="M310 0c-10 80 50 120 80 140V0z" fill="#CFE0F3"></path></svg><span style="position:relative;width:76px;height:76px;border-radius:50%;background:rgba(139,92,246,.18);display:grid;place-items:center;color:#8B5CF6;margin-top:-40px">{{ I.aPinLg }}</span></div>
                  <div class="a-bot"><div class="a-btn" style="background:#8B5CF6;color:#fff;font-weight:600">Guardar ubicación</div></div>
                </div></sc-if>
                <sc-if value="{{ st.cap.fm }}"><div class="fade a-col"><sc-use tpl="p-sb" with="{{ sbD }}"></sc-use>
                  <div class="a-top"><div><span>{{ I.aBack }}</span><b>Checklist de mantenimiento</b><span></span></div></div>
                  <div class="a-body">
                    <div class="a-q"><div class="a-qh"><span class="a-qn">1</span><span>¿El equipo enciende?<em> *</em></span></div><div class="a-yn"><span class="on">{{ I.aCheck }}Sí</span><span><i style="display:flex;color:#6B675E">{{ I.aX }}</i>No</span></div></div>
                    <div class="a-q" style="margin-left:12px;border-left:3px solid #2E8B57"><div class="a-qh"><span class="a-qn">1.1</span><span>Temperatura de salida (°C)<em> *</em></span></div><div style="display:flex;gap:8px;margin-top:12px"><span style="width:56px;height:56px;border-radius:14px;background:#F5F6F8;display:grid;place-items:center">{{ I.aMinus }}</span><span style="flex:1;height:56px;border-radius:14px;background:#F5F6F8;display:grid;place-items:center;font-size:18px;font-weight:700">18</span><span style="width:56px;height:56px;border-radius:14px;background:#F5F6F8;display:grid;place-items:center">{{ I.aPlus }}</span></div></div>
                    <div class="a-q"><div class="a-qh"><span class="a-qn">2</span><span>¿Hay fuga visible?<em> *</em></span></div><div class="a-yn"><span><i style="display:flex;color:#6B675E">{{ I.aCheck }}</i>Sí</span><span class="on">{{ I.aX }}No</span></div></div>
                    <div class="a-q"><div class="a-qh"><span class="a-qn">3</span><span>Foto de la placa del equipo</span></div><div style="margin-top:12px;width:96px;height:96px;border-radius:16px;border:1.5px dashed #8B5CF6;background:rgba(237,228,254,.45);color:#8B5CF6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600">{{ I.aCam }}Tomar</div></div>
                  </div>
                  <div class="a-bot"><div class="a-btn" style="background:#8B5CF6;color:#fff;font-weight:600">{{ I.aCheck20 }}Guardar formulario</div></div>
                </div></sc-if>
                <sc-if value="{{ st.cap.ph }}"><div class="fade a-col"><sc-use tpl="p-sb" with="{{ sbD }}"></sc-use>
                  <div style="padding:40px 16px 0;display:flex;align-items:center;gap:10px"><span class="a-ib">{{ I.aBack }}</span><b style="flex:1;font-size:19px;font-weight:800;letter-spacing:-.3px">Foto evidencia</b><span class="a-mini" style="background:#E8F0D6;color:#4F7A3A">{{ I.aCam14 }}3 fotos</span></div>
                  <div style="flex:1;min-height:0;padding:18px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start">
                    <sc-for list="{{ shots }}" as="p"><div style="aspect-ratio:1;border-radius:16px;background:{{ p.bg }};position:relative;overflow:hidden"><span style="position:absolute;left:8px;bottom:8px;height:22px;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center">{{ p.tm }}</span></div></sc-for>
                    <div style="aspect-ratio:1;border-radius:16px;border:1.5px dashed #8B5CF6;background:rgba(237,228,254,.45);color:#8B5CF6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600">{{ I.aCam }}Agregar</div>
                  </div>
                  <div class="a-bot"><div class="a-btn" style="background:#8B5CF6;color:#fff;font-weight:600">Guardar y continuar</div></div>
                </div></sc-if>
                <sc-if value="{{ st.cap.sg }}"><div class="fade a-col"><sc-use tpl="p-sb" with="{{ sbD }}"></sc-use>
                  <div style="padding:40px 16px 0;display:flex;align-items:center;gap:10px"><span class="a-ib">{{ I.aBack }}</span><b style="flex:1;font-size:19px;font-weight:800;letter-spacing:-.3px">Firma de recibido</b><span class="a-mini" style="background:#DCF5E6;color:#166534">Firmado</span></div>
                  <div style="flex:1;min-height:0;padding:22px 16px 0">
                    <div style="font-size:11.5px;font-weight:800;letter-spacing:.6px;color:#6B675E">¿QUIÉN FIRMA?</div>
                    <div style="margin-top:8px;height:52px;border-radius:12px;background:#F5F6F8;display:flex;align-items:center;padding:0 16px;font-size:15px">Laura Méndez</div>
                    <div style="margin-top:16px;height:300px;border-radius:16px;background:#F5F6F8;border:1px solid #EAECF0;position:relative"><svg viewBox="0 0 300 150" style="position:absolute;left:24px;right:24px;top:60px;width:calc(100% - 48px)"><path d="M14 96c18-46 40-70 50-38s-12 58 8 36 30-56 46-34-6 46 14 28 26-40 42-22 4 28 24 16 34-24 84-30" fill="none" stroke="#34312B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></svg><i style="position:absolute;left:24px;right:24px;bottom:56px;height:1.5px;background:#D6D9E0"></i><span style="position:absolute;right:14px;top:12px;font-size:13px;font-weight:600;color:#7C4DEB">Borrar</span></div>
                  </div>
                  <div class="a-bot"><div class="a-btn" style="background:#7C4DEB;color:#fff;font-weight:600">Guardar firma</div></div>
                </div></sc-if>
                <sc-if value="{{ st.cap.dt }}"><div class="fade a-col"><sc-use tpl="p-detail" with="{{ st.cap.d }}"></sc-use></div></sc-if>
                <i class="ph-g"></i>
              </div></div></div>
            </div></sc-if>

            <!-- 04 Sin señal: hoja "Por enviar" -->
            <sc-if value="{{ st.f3 }}"><div class="fade">
              <div class="note" style="left:28px;top:170px;width:186px"><b>Modo offline</b>Actívalo si la señal es inestable: todo se guarda en el teléfono.</div>
              <div class="note" style="left:28px;top:296px;width:186px"><b>Sin conexión · GPS activo</b>La ubicación se registra con el GPS del teléfono.</div>
              <div class="ph" style="--s:.72;left:290px;top:34px"><div class="ph-b"><div class="ph-s">
                <sc-use tpl="p-sb" with="{{ st.off.sb }}"></sc-use><sc-use tpl="p-list" with="{{ st.lOff }}"></sc-use>
                <div style="position:absolute;inset:0;background:rgba(20,18,30,.45);z-index:3"></div>
                <div class="a-sheet">
                  <i style="display:block;width:40px;height:4px;border-radius:4px;background:#D6D9E0;margin:0 auto 14px"></i>
                  <div style="font-size:22px;font-weight:800;letter-spacing:-.4px">Por enviar</div>
                  <div style="margin-top:4px;font-size:13.5px;color:#6B675E">Lo que trabajaste sin conexión se guarda en tu teléfono hasta enviarlo.</div>

    <div class="wrap foot-g" style="display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:32px">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="display:flex;align-items:center;gap:9px"><svg width="26" height="28" viewBox="62 44 230 242" fill="none" style="color:#111118"><rect x="132" y="50" width="12" height="28" rx="6" fill="#7C3AED"></rect><rect x="132" y="158" width="12" height="28" rx="6" fill="currentColor"></rect><rect x="70" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="178" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 82) rotate(45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 82) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 154) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 154) rotate(45)"></rect><circle cx="138" cy="118" r="27" stroke="currentColor" stroke-width="13"></circle><circle cx="138" cy="118" r="7" fill="currentColor"></circle><g fill="currentColor"><circle cx="138" cy="197" r="7"></circle><circle cx="152" cy="211" r="7"></circle><circle cx="173" cy="211" r="7"></circle><circle cx="195" cy="207" r="7"></circle><circle cx="217" cy="203" r="7"></circle><circle cx="238" cy="202" r="7"></circle></g><circle cx="252" cy="247" r="32" fill="#7C3AED"></circle><circle cx="252" cy="247" r="16" fill="#FFFFFF"></circle><circle cx="252" cy="247" r="8" fill="#7C3AED"></circle></svg><span style="font-size:19px;font-weight:800;letter-spacing:-0.04em">HelmPoint</span></span>
        <span style="font-size:14px;color:#7E7F8C;max-width:280px;line-height:1.5">La app para tu equipo en campo y el panel para quien lo dirige.</span>
      </div>
      <sc-for list="{{ footCols }}" as="c">
        <div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:13px;font-weight:700;color:#111118">{{ c.t }}</span><sc-for list="{{ c.items }}" as="i"><a href="{{ i.h }}" onClick="{{ i.on }}" style="font-size:14px;color:#7E7F8C">{{ i.t }}</a></sc-for></div>
      </sc-for>
    </div>
    <div class="wrap" style="margin-top:36px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:13px;color:#7E7F8C"><span>© 2026 HelmPoint · Helmdeck S.A.S.</span><a href="#" onClick="{{ openPriv }}" style="color:#7E7F8C">Aviso de Privacidad</a><a href="#" onClick="{{ openTerms }}" style="color:#7E7F8C">Términos de uso</a></div>
  </footer>

  <!-- LEGAL (modal) -->
  <sc-if value="{{ lg.open }}">
    <div role="dialog" aria-modal="true" aria-label="Legal" style="position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px">
      <div onClick="{{ lg.close }}" style="position:absolute;inset:0;background:rgba(17,17,24,.48);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:hpFade .25s ease both"></div>
      <div style="position:relative;width:100%;max-width:640px;max-height:calc(100vh - 32px);background:var(--surface);color:var(--text);border-radius:30px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 90px -30px rgba(17,17,30,.5);animation:hpModal .35s cubic-bezier(.2,.8,.2,1) both">
        <div style="padding:26px 28px 0;display:flex;align-items:center;gap:12px">
          <svg width="26" height="28" viewBox="62 44 230 242" fill="none" style="color:var(--text)"><rect x="132" y="50" width="12" height="28" rx="6" fill="#7C3AED"></rect><rect x="132" y="158" width="12" height="28" rx="6" fill="currentColor"></rect><rect x="70" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="178" y="112" width="28" height="12" rx="6" fill="currentColor"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 82) rotate(45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 82) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(102 154) rotate(-45)"></rect><rect x="-8" y="-5" width="16" height="10" rx="5" fill="currentColor" transform="translate(174 154) rotate(45)"></rect><circle cx="138" cy="118" r="27" stroke="currentColor" stroke-width="13"></circle><circle cx="138" cy="118" r="7" fill="currentColor"></circle><g fill="currentColor"><circle cx="138" cy="197" r="7"></circle><circle cx="152" cy="211" r="7"></circle><circle cx="173" cy="211" r="7"></circle><circle cx="195" cy="207" r="7"></circle><circle cx="217" cy="203" r="7"></circle><circle cx="238" cy="202" r="7"></circle></g><circle cx="252" cy="247" r="32" fill="#7C3AED"></circle><circle cx="252" cy="247" r="16" fill="var(--surface)"></circle><circle cx="252" cy="247" r="8" fill="#7C3AED"></circle></svg>
          <span style="font-size:22px;font-weight:800;letter-spacing:-0.03em">Legal</span>
          <button class="sx7" type="button" onClick="{{ lg.close }}" aria-label="Cerrar" style="margin-left:auto;width:40px;height:40px;border:0;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;cursor:pointer" >{{ I.x }}</button>
        </div>
        <div style="padding:18px 28px 0">
          <div role="tablist" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--surface-2)">
            <sc-for list="{{ lg.tabs }}" as="tb"><button type="button" role="tab" aria-selected="{{ tb.aria }}" onClick="{{ tb.on }}" style="height:42px;border:0;border-radius:12px;background:{{ tb.bg }};color:{{ tb.fg }};box-shadow:{{ tb.sh }};font-size:14.5px;font-weight:600;cursor:pointer;transition:all .2s">{{ tb.t }}</button></sc-for>
          </div>
        </div>
        <div class="lg-body" style="flex:1;min-height:0;overflow-y:auto;padding:24px 28px 8px">
          <h2 style="margin:0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-0.035em">{{ lg.d.title }}</h2>
          <div style="display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;color:var(--text-3)"><span style="height:24px;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-weight:600;display:flex;align-items:center">{{ lg.d.ver }}</span>{{ lg.d.date }}</div>
          <div style="margin-top:20px;padding:20px;border-radius:22px;background:var(--accent-soft)">
            <span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)">En resumen</span>
            <div style="display:flex;flex-direction:column;gap:16px;margin-top:14px">
              <sc-for list="{{ lg.d.sum }}" as="m"><div style="display:flex;gap:14px;align-items:flex-start"><span style="width:36px;height:36px;border-radius:50%;background:var(--accent);color:#FFFFFF;display:grid;place-items:center;flex:none">{{ m.ic }}</span><div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:700">{{ m.t }}</span><span style="font-size:14px;line-height:1.5;color:var(--text-2)">{{ m.d }}</span></div></div></sc-for>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
            <sc-for list="{{ lg.d.secs }}" as="x">
              <div style="border:1px solid {{ x.bd }};border-radius:20px;overflow:hidden;transition:border-color .2s">
                <button type="button" aria-expanded="{{ x.aria }}" onClick="{{ x.on }}" style="width:100%;border:0;background:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--text)">
                  <span style="width:32px;height:32px;border-radius:50%;background:var(--accent);color:#FFFFFF;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none">{{ x.n }}</span>
                  <span style="flex:1;font-size:15.5px;font-weight:700">{{ x.t }}</span>
                  <span style="display:flex;color:var(--text-3);transform:{{ x.rot }};transition:transform .25s">{{ I.chevD }}</span>
                </button>
                <sc-if value="{{ x.open }}">
                  <div class="up" style="padding:0 18px 18px 62px;display:flex;flex-direction:column;gap:10px">
                    <sc-for list="{{ x.ps }}" as="p"><p style="margin:0;font-size:14.5px;line-height:1.6;color:var(--text-2)">{{ p.t }}</p></sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
          <p style="margin:18px 0 10px;font-size:13px;line-height:1.55;color:var(--text-3)">{{ lg.d.foot }}</p>
        </div>
        <div style="padding:16px 28px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:13px;color:var(--text-3)">¿Dudas? <b style="color:var(--text-2);font-weight:600">{{ lg.mail }}</b></span>
          <button class="sx8" type="button" onClick="{{ lg.close }}" style="margin-left:auto;height:48px;padding:0 28px;border:0;border-radius:999px;background:var(--accent);color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer" >Entendido</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</template>
<!-- Parciales de la app (se usan con <sc-use>; el dato llega como `v`) -->
<template id="p-sb"><div class="ph-sb" style="color:{{ v.fg }}"><span>9:41</span><span style="display:flex;gap:5px;align-items:center">{{ v.i1 }}{{ v.i2 }}{{ v.i3 }}</span></div></template>

<template id="p-detail">
<div class="a-col">
  <div class="ph-sb" style="color:#fff;background:{{ v.heroBg }};transition:background .7s"><span>9:41</span><span style="display:flex;gap:5px;align-items:center">{{ I.sbWifi }}{{ I.sbSignal }}{{ I.sbBattery }}</span></div>
  <div class="a-scroll"><div style="transform:translateY({{ v.shift }});transition:transform .7s cubic-bezier(.2,.8,.2,1)">
    <div class="a-hero" style="background:{{ v.heroBg }}">
      <div class="a-waves"><i></i><i></i></div>
      <div class="a-hrow"><span class="a-cb">{{ I.aChevL }}</span><span class="a-code">ACT-2051</span><span class="a-cb">{{ I.aMore }}</span></div>
      <div style="position:relative;padding:12px 20px 0">
        <span class="a-pill"><i></i>{{ v.chip }}</span>
        <div style="margin-top:10px;font-size:14px;font-weight:500;opacity:.9">{{ v.sub }}</div>
        <div class="a-title">Mantenimiento preventivo</div>
        <div class="a-chips"><span class="a-chip">{{ I.aTag }}Aire acondicionado</span><span class="a-chip">{{ I.aPin }}Hospital San José</span></div>
      </div>
      <div class="a-met"><div><small>INICIO</small><b>{{ v.ini }}</b></div><div><small>CIERRE</small><b>{{ v.fin }}</b></div><div><small>PASOS</small><b style="color:{{ v.pasosC }}">{{ v.pasos }}</b></div></div>
    </div>
    <div style="height:60px"></div>
    <div class="a-sh"><h3>Pasos</h3><span>{{ v.req }}</span></div>
    <div style="padding:0 16px 24px">
      <sc-for list="{{ v.blocks }}" as="b"><div class="a-tl">
        <i class="a-rail" style="top:{{ b.railT }};bottom:{{ b.railB }}"></i>
        <span class="a-dot" style="background:{{ b.dotBg }};color:{{ b.dotFg }}">{{ b.dot }}</span>
        <div class="a-card" style="border-color:{{ b.bd }};box-shadow:{{ b.sh }}">
          <div class="a-row"><span class="a-ic" style="background:{{ b.icBg }};color:{{ b.icFg }}">{{ b.ic }}</span><span style="flex:1;min-width:0"><b>{{ b.t }}</b><sc-if value="{{ b.hasSub }}"><small>{{ b.sub }}</small></sc-if></span><span class="a-go" style="background:{{ b.indBg }};color:{{ b.indFg }}">{{ b.ind }}</span></div>
          <sc-if value="{{ b.hasKids }}"><div class="a-kids">
            <div class="a-kh">{{ b.kIc }}<span style="flex:1">{{ b.kLabel }}</span></div>
            <sc-if value="{{ b.chips }}"><div style="display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px"><sc-for list="{{ b.kids }}" as="c"><span class="a-kc"><span style="display:flex;color:#6B675E">{{ c.chipIc }}</span>{{ c.t }}</span></sc-for></div></sc-if>
            <sc-if value="{{ b.rows }}"><div class="fade" style="display:flex;flex-direction:column;gap:6px;padding:0 10px 10px"><sc-for list="{{ b.kids }}" as="c"><div class="a-kr" style="background:{{ c.bg }};box-shadow:{{ c.sh }};color:{{ c.fg }}"><i style="background:{{ c.icBg }};color:{{ c.icFg }}">{{ c.ic }}</i><span style="flex:1">{{ c.t }}</span><span style="display:flex;color:{{ c.endFg }}">{{ c.end }}</span></div></sc-for></div></sc-if>
          </div></sc-if>
        </div>
      </div></sc-for>
    </div>
  </div></div>
  <div class="a-cta"><div class="a-btn" style="background:{{ v.ctaBg }};color:{{ v.ctaFg }}">{{ v.cta }}{{ v.ctaIc }}</div></div>
</div>
</template>

<template id="p-list">
<div class="a-col" style="padding-top:28px">
  <sc-if value="{{ v.push }}"><div class="a-push"><span style="width:40px;height:40px;border-radius:12px;background:#5B2FC9;color:#fff;display:grid;place-items:center;flex:none">{{ v.I.bell }}</span><span style="flex:1;min-width:0"><span style="display:flex;font-size:11.5px;color:#6B675E"><span style="flex:1">HelmPoint</span>ahora</span><b style="display:block;font-size:14.5px;font-weight:800">Nueva actividad asignada</b><span style="display:block;font-size:13px;color:#4A4740;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Mantenimiento preventivo · Hospital San José</span></span></div></sc-if>
  <div style="padding:10px 16px 0;display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:9px;background:#34312B;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center">CN</span><b style="flex:1;font-size:15px;font-weight:700">Clima Norte</b><span class="a-ib">{{ v.I.search }}</span><span class="a-ib">{{ v.I.filter }}</span></div>
  <div style="padding:14px 16px 0;font-size:24px;font-weight:800;letter-spacing:-.5px">Mis actividades</div>
  <div style="margin:12px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:#F2F3F5"><span style="height:38px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:700">Asignadas <em style="font-style:normal;background:#5B2FC9;color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:11px">{{ v.total }}</em></span><span style="height:38px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:#6B675E">Creadas por mí</span></div>
  <div style="margin:14px 16px 0;padding:14px;border-radius:14px;background:#F5F6F8">
    <div style="font-size:12.5px;font-weight:600;color:#6B675E">Tu progreso</div>
    <div style="margin-top:2px;font-size:17px;font-weight:800;letter-spacing:-.3px">1 de {{ v.total }} terminadas</div>
    <div style="display:flex;gap:3px;margin-top:10px;height:6px"><i style="flex:1;border-radius:6px;background:#2E8B57"></i><i style="flex:{{ v.n }};border-radius:6px;background:#CDC6EF"></i></div>
    <div style="display:flex;gap:14px;margin-top:9px;font-size:12px;color:#4A4740"><span style="display:flex;align-items:center;gap:5px"><i style="width:7px;height:7px;border-radius:50%;background:#2E8B57"></i>1 terminada</span><span style="display:flex;align-items:center;gap:5px"><i style="width:7px;height:7px;border-radius:50%;background:#CDC6EF"></i>{{ v.legend }}</span></div>
  </div>
  <div style="margin:18px 16px 10px;display:flex;align-items:center;gap:8px"><b style="font-size:16px;font-weight:800">Por iniciar</b><span style="min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#EDE4FE;color:#5B2FC9;font-size:11.5px;font-weight:800;display:grid;place-items:center">{{ v.n }}</span><span style="margin-left:auto;display:flex;color:#6B675E">{{ v.I.chevD }}</span></div>
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden">
    <sc-for list="{{ v.cards }}" as="a"><div class="a-act" style="border-color:{{ a.bd }};box-shadow:{{ a.sh }}"><span class="tm"><b>{{ a.tm }}</b><small>HOY</small></span><span style="width:1px;align-self:stretch;background:#EAECF0"></span><span style="flex:1;min-width:0"><b style="display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ a.t }}</b><span style="display:flex;align-items:center;gap:6px;margin-top:4px"><span class="a-tag">{{ a.tag }}</span><span style="font-size:12px;color:#6B675E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ a.c }}</span></span><span style="display:block;margin-top:4px;font-size:12px;font-weight:600;color:#5B2FC9">{{ a.det }}</span></span><span style="width:38px;height:38px;border-radius:50%;background:#5B2FC9;color:#fff;display:grid;place-items:center;flex:none">{{ v.I.play }}</span></div></sc-for>
  </div>
  <div class="a-nav"><span class="on">{{ v.I.cal }}Hoy</span><span>{{ v.I.pie }}Resumen</span><u>{{ v.I.plus }}</u><span>{{ v.I.bellN }}Avisos</span><span>{{ v.I.user }}Perfil</span></div>
</div>
</template>
<script src="assets/icons.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
